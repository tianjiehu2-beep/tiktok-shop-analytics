name: scrape-tiktok-experiment

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Search keyword"
        required: false
        default: "yoga mat"
      limit:
        description: "Max products to collect"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + Playwright Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Diagnose what TikTok returns
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          URL = "https://shop.tiktok.com/us/s?q=yoga%20mat"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              ctx = b.new_context(locale="en-US", timezone_id="America/New_York", user_agent=UA)
              page = ctx.new_page()
              captured = {}

              def on_response(resp):
                  u = resp.url
                  if "page_data" in u:
                      try:
                          body = resp.body()
                          captured["page_data"] = body
                          d = json.loads(body)
                          def find_lists(o, path=""):
                              out = []
                              if isinstance(o, dict):
                                  for k, v in o.items():
                                      if isinstance(v, list) and v and isinstance(v[0], dict):
                                          out.append((path + "/" + k, len(v), list(v[0].keys())[:25]))
                                      else:
                                          out += find_lists(v, path + "/" + k)
                              return out
                          print("PAGE_DATA_LISTS:", json.dumps(find_lists(d))[:1200])
                      except Exception as e:
                          print("PAGE_DATA_PARSE_ERR:", str(e)[:200])
              page.on("response", on_response)

              page.goto(URL, wait_until="domcontentloaded", timeout=45000)
              page.wait_for_timeout(10000)
              page.mouse.wheel(0, 2000)
              page.wait_for_timeout(2000)

              if "page_data" in captured:
                  open("page_data.json", "wb").write(captured["page_data"])
                  print("PAGE_DATA_SAVED", len(captured["page_data"]))
              else:
                  print("NO_PAGE_DATA")
              print("PDP_LINKS:", page.evaluate("() => document.querySelectorAll('a[href*=\"/pdp/\"]').length"))
              cards = page.evaluate("""() => {
                  const links = Array.from(document.querySelectorAll('a[href*="/pdp/"]')).slice(0, 3);
                  return links.map(a => a.innerText.replace(/\n/g, ' | ').slice(0, 300));
              }""")
              for c in cards:
                  print("CARD:", c)
              page.screenshot(path="diagnose_0.png")
              b.close()
          PY

      - name: Direct scrape TikTok Shop
        run: |
          python main.py run --source scraper --keyword "${{ github.event.inputs.keyword }}" --limit "${{ github.event.inputs.limit }}" || echo "SCRAPER_FAILED=1"

      - name: Report result
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db_path = Path("data/tiktok_shop.db")
          if not db_path.exists():
              print("NO_DB: scraper did not write any data")
              raise SystemExit(1)
          con = sqlite3.connect(str(db_path))
          n = con.execute("select count(*) from products").fetchone()[0]
          titles = [r[0] for r in con.execute("select title from products limit 5")]
          con.close()
          rows = con.execute("select product_id, title, price, sold_count, rating, seller_name from products limit 8").fetchall()
          print("DB_PRODUCTS=" + str(n))
          for r in rows:
              print("  sample:", r)
          if n == 0:
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-result
          path: |
            data/tiktok_shop.db
            reports/tiktok_shop_report.html
            diagnose_0.png
            page_data.json
