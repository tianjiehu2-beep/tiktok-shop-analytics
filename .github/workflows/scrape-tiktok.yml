name: scrape-tiktok-experiment

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Search keyword"
        required: false
        default: "yoga mat"
      region:
        description: "TikTok Shop region (US/TH/SG/ID/MY/PH/VN)"
        required: false
        default: "TH"
      limit:
        description: "Max products to collect"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + Playwright Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Diagnose TH and ID shop pages
        run: python tools/diag_sea.py --keyword "${{ github.event.inputs.keyword }}" --regions "TH,ID"

      - name: Try the project scraper for the region
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from ttshop.scraper.tiktok_shop import TikTokShopScraper
          region = "${{ github.event.inputs.region }}"
          kw = "${{ github.event.inputs.keyword }}"
          lim = int("${{ github.event.inputs.limit }}")
          try:
              s = TikTokShopScraper(region=region, headless=True, max_products_per_run=lim)
              prods = s.scrape_search(kw, limit=lim)
              print("COLLECTED:", len(prods))
              for p in prods[:8]:
                  print("  ", p.product_id, "|", str(p.title)[:50], "|", p.price, "|", str(p.seller_name)[:40])
          except Exception as exc:
              print("SCRAPER_FAILED:", type(exc).__name__, str(exc)[:300])
              raise
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-result
          path: |
            data/tiktok_shop.db
            diag_TH.png
            diag_ID.png
