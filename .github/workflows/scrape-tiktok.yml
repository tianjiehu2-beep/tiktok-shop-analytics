name: scrape-tiktok-experiment

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Search keyword"
        required: false
        default: "yoga mat"
      limit:
        description: "Max products to collect"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + Playwright Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Diagnose what TikTok returns
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          urls = ['https://shop.tiktok.com/us/c/835592', 'https://shop.tiktok.com/us/c/sports-and-outdoors', 'https://shop.tiktok.com/us/s?q=yoga%20mat&cat=835592', 'https://shop.tiktok.com/us/s?q=yoga%20mat&category=835592', 'https://www.tiktok.com/shop/c/835592?region=US']
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              ctx = b.new_context(locale="en-US", timezone_id="America/New_York", user_agent=UA)
              page = ctx.new_page()
              for i, url in enumerate(urls):
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=40000)
                      page.wait_for_timeout(5000)
                      print(f"--- URL[{i}] ---")
                      print("REQ:", url)
                      print("TITLE:", page.title())
                      print("FINAL:", page.url)
                      pdp = page.evaluate("() => document.querySelectorAll('a[href*=\"/pdp/\"]').length")
                      print('PDP:', pdp)
                  except Exception as exc:
                      print(f"--- URL[{i}] ERROR:", str(exc)[:200])
              b.close()
          PY
      - name: Direct scrape TikTok Shop
        run: |
          python main.py run --source scraper --keyword "${{ github.event.inputs.keyword }}" --limit "${{ github.event.inputs.limit }}" || echo "SCRAPER_FAILED=1"

      - name: Report result
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db_path = Path("data/tiktok_shop.db")
          if not db_path.exists():
              print("NO_DB: scraper did not write any data")
              raise SystemExit(1)
          con = sqlite3.connect(str(db_path))
          n = con.execute("select count(*) from products").fetchone()[0]
          rows = con.execute("select product_id, title, price, sold_count, rating, seller_name from products limit 8").fetchall()
          con.close()
          print("DB_PRODUCTS=" + str(n))
          for r in rows:
              print("  sample:", r)
          if n == 0:
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-result
          path: |
            data/tiktok_shop.db
            reports/tiktok_shop_report.html
            diagnose_0.png
            diagnose_0.html
