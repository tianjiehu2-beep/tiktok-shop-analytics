name: scrape-tiktok-experiment

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Search keyword"
        required: false
        default: "yoga mat"
      limit:
        description: "Max products to collect"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + Playwright Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Diagnose what TikTok returns
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          urls = [
              "https://shop.tiktok.com/us/s?q=yoga%20mat",
              "https://www.tiktok.com/shop/s?q=yoga%20mat",
          ]
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              ctx = b.new_context(locale="en-US", timezone_id="America/New_York", user_agent=UA)
              page = ctx.new_page()
              api_log = []

              def on_response(resp):
                  u = resp.url
                  if any(k in u for k in ("api", "search", "query", "graphql", "products")):
                      try:
                          ct = resp.headers.get("content-type", "")
                          if "json" in ct:
                              api_log.append((resp.status, u[:250]))
                      except Exception:
                          pass
              page.on("response", on_response)

              for i, url in enumerate(urls):
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=45000)
                      page.wait_for_timeout(8000)
                      for _ in range(5):
                          page.mouse.wheel(0, 1200)
                          page.wait_for_timeout(1200)
                      print(f"--- URL[{i}] ---")
                      print("TITLE:", page.title())
                      print("FINAL_URL:", page.url)
                      ld = page.evaluate("""() => {
                          const out = [];
                          for (const s of document.querySelectorAll('script[type="application/ld+json"]')) {
                              try {
                                  const d = JSON.parse(s.textContent);
                                  out.push({type: d['@type'] || '?', len: s.textContent.length});
                              } catch (e) { out.push({type: 'PARSE_ERR'}); }
                          }
                          return out;
                      }""")
                      print("JSONLD_BLOCKS:", json.dumps(ld))
                      globs = page.evaluate("""() => {
                          const keys = Object.keys(window).filter(k => /data|state|init|render|shop|product/i.test(k));
                          return keys.slice(0, 50);
                      }""")
                      print("WINDOW_KEYS:", json.dumps(globs))
                      print("BODY_LEN:", page.evaluate("document.body ? document.body.innerText.length : 0"))
                      print("PDP_LINKS:", page.evaluate("""() => document.querySelectorAll('a[href*="/pdp/"]').length"""))
                      html = page.evaluate("document.documentElement.outerHTML")
                      open(f"diagnose_{i}.html", "w", encoding="utf-8").write(html)
                      page.screenshot(path=f"diagnose_{i}.png")
                  except Exception as exc:
                      print(f"--- URL[{i}] ERROR:", str(exc)[:300])
              print("=== API RESPONSES ===")
              for status, u in api_log[:50]:
                  print(status, u)
              b.close()
          PY

      - name: Direct scrape TikTok Shop
        run: |
          python main.py run --source scraper --keyword "${{ github.event.inputs.keyword }}" --limit "${{ github.event.inputs.limit }}" || echo "SCRAPER_FAILED=1"

      - name: Report result
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db_path = Path("data/tiktok_shop.db")
          if not db_path.exists():
              print("NO_DB: scraper did not write any data")
              raise SystemExit(1)
          con = sqlite3.connect(str(db_path))
          n = con.execute("select count(*) from products").fetchone()[0]
          titles = [r[0] for r in con.execute("select title from products limit 5")]
          con.close()
          print("DB_PRODUCTS=" + str(n))
          for t in titles:
              print("  sample:", (t or "")[:60])
          if n == 0:
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-result
          path: |
            data/tiktok_shop.db
            reports/tiktok_shop_report.html
            diagnose_0.png
            diagnose_1.png
            diagnose_0.html
            diagnose_1.html
