name: scrape-tiktok-experiment

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Search keyword"
        required: false
        default: "yoga mat"
      region:
        description: "TikTok Shop region (US/TH/SG/ID/MY/PH/VN)"
        required: false
        default: "TH"
      limit:
        description: "Max products to collect"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + Playwright Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Diagnose what TikTok returns for the region
        run: |
          python - <<'PY'
          import urllib.parse
          from playwright.sync_api import sync_playwright

          region = "${{ github.event.inputs.region }}"
          q = urllib.parse.quote("${{ github.event.inputs.keyword }}")
          urls = [
              f"https://shop.tiktok.com/{region.lower()}/s?q={q}",
              f"https://www.tiktok.com/shop/{region.lower()}/search?q={q}",
              f"https://shop.tiktok.com/{region.lower()}/c/0?q={q}",
          ]
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              ctx = b.new_context(locale="en-US", timezone_id="America/New_York", user_agent=UA)
              page = ctx.new_page()
              for i, url in enumerate(urls):
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=45000)
                      page.wait_for_timeout(5000)
                      print(f"--- URL[{i}] ---")
                      print("REQ:", url)
                      print("TITLE:", (page.title() or '')[:120])
                      print("FINAL:", page.url[:120])
                      pdp = page.evaluate("() => document.querySelectorAll('a[href*="/pdp/"]').length")
                      print("PDP:", pdp)
                      body = page.evaluate("() => document.body ? document.body.innerText.slice(0,300) : ''")
                      print("BODY:", body.replace(chr(10), ' | ')[:300])
                  except Exception as exc:
                      print(f"--- URL[{i}] ERROR:", str(exc)[:200])
              b.close()
          PY

      - name: Try the project scraper for the region
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from ttshop.scraper.tiktok_shop import TikTokShopScraper
          region = "${{ github.event.inputs.region }}"
          kw = "${{ github.event.inputs.keyword }}"
          lim = int("${{ github.event.inputs.limit }}")
          try:
              s = TikTokShopScraper(region=region, headless=True, max_products_per_run=lim)
              prods = s.scrape_search(kw, limit=lim)
              print("COLLECTED:", len(prods))
              for p in prods[:8]:
                  print("  ", p.product_id, "|", str(p.title)[:50], "|", p.price, "|", str(p.seller_name)[:40])
          except Exception as exc:
              print("SCRAPER_FAILED:", type(exc).__name__, str(exc)[:300])
              raise
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-result
          path: |
            data/tiktok_shop.db
