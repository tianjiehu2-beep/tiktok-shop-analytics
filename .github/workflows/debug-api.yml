name: debug-echotik-api

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TTSHOP_API_KEY: ${{ secrets.TTSHOP_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Debug EchoTik API
        run: |
          python - <<'PY'
          import os, urllib.request

          key = os.environ.get("TTSHOP_API_KEY", "")
          print("KEY_PRESENT:", bool(key), "LEN:", len(key), "HEAD:", repr(key[:12]))
          auth = "Basic " + key.strip()
          tests = [
              ("search_TH", "https://open.echotik.live/api/v3/echotik/search/items?keyword=yoga%20mat&region=TH&count=3&page_num=1&page_size=3"),
              ("cat_TH", "https://open.echotik.live/api/v3/echotik/product/list?region=TH&page_num=1&page_size=3&off_mark=0&level3_category_id=603084"),
              ("cat_US", "https://open.echotik.live/api/v3/echotik/product/list?region=US&page_num=1&page_size=3&off_mark=0&level3_category_id=603084"),
              ("cats_l1", "https://open.echotik.live/api/v3/echotik/category/l1?language=en-US"),
          ]
          for name, url in tests:
              try:
                  req = urllib.request.Request(url, headers={"Authorization": auth})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      print(f"[{name}] STATUS={resp.status} LEN={len(body)}")
                      print("  BODY:", body[:250].replace(chr(10), " "))
              except Exception as exc:
                  print(f"[{name}] ERROR: {type(exc).__name__}: {str(exc)[:250]}")
          PY
