name: daily-report

on:
  schedule:
    - cron: "30 0 * * *"     # 每天 00:30 UTC = 北京时间 08:30
  workflow_dispatch:          # 支持在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行单元测试
        run: python -m unittest discover -s tests

      - name: 免费真实采集（GitHub 海外 IP + Playwright）
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python main.py run --source scraper --keyword "yoga mat" --limit 30 || echo "scraper: yoga mat 采集失败"
          python main.py run --source scraper --keyword "massage gun" --limit 20 || echo "scraper: massage gun 采集失败"
          python main.py run --source scraper --keyword "air fryer" --limit 20 || echo "scraper: air fryer 采集失败"

      - name: 生成数据与看板
        run: |
          if python - <<'PY'
          import os, sqlite3
          if os.path.exists("data/tiktok_shop.db"):
              n = sqlite3.connect("data/tiktok_shop.db").execute("select count(*) from products").fetchone()[0]
              print("DB_PRODUCTS=", n)
              raise SystemExit(0 if n >= 10 else 1)
          raise SystemExit(1)
          PY
          then
            echo "已通过免费 Playwright 采集到真实数据，跳过补充采集"
          elif [ -n "${{ secrets.TTSHOP_API_KEY }}" ]; then
            python main.py run --source api --category-id 603084 --pages 5 --sort sales7d --enrich --api-key "${{ secrets.TTSHOP_API_KEY }}" || python main.py run --source demo --products 300
            python main.py run --source api --keyword "yoga mat" --limit 30 --with-influencers --api-key "${{ secrets.TTSHOP_API_KEY }}" || echo "keyword collection skipped"
            python main.py influencers --sort followers --pages 2 --limit 20 --api-key "${{ secrets.TTSHOP_API_KEY }}" || echo "influencers collection skipped"
            python main.py keywords --tab all --limit 15 --api-key "${{ secrets.TTSHOP_API_KEY }}" || echo "keywords collection skipped"
          else
            python main.py run --source demo --products 300
          fi

      - name: 复制为 Pages 首页
        run: |
          cp reports/tiktok_shop_report.html reports/index.html
          if [ -f data/tiktok_shop.db ]; then cp data/tiktok_shop.db reports/tiktok_shop.db; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
