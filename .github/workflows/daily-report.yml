name: daily-report

on:
  schedule:
    - cron: "30 0 * * *"     # 每天 00:30 UTC = 北京时间 08:30
  workflow_dispatch:          # 支持在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行单元测试
        run: python -m unittest discover -s tests

      - name: 每日真实采集（EchoTik 泰国 API，失败自动降级 FastMoss / SocialCrawl / demo）
        env:
          TTSHOP_SOCIALCRAWL_KEY: ${{ secrets.TTSHOP_SOCIALCRAWL_KEY }}
        run: |
          pip install -r requirements.txt
          python main.py run --source auto --category-id 603084 --pages 5 --sort sales7d --enrich --api-key "${{ secrets.TTSHOP_API_KEY }}" || echo "category collection failed"
          python main.py run --source auto --keyword "yoga mat,massage gun,air fryer" --limit 30 --with-influencers --api-key "${{ secrets.TTSHOP_API_KEY }}" || echo "keyword collection failed"
          python main.py influencers --sort followers --pages 2 --limit 20 --api-key "${{ secrets.TTSHOP_API_KEY }}" || echo "influencers collection failed"
          python main.py keywords --tab all --limit 15 --api-key "${{ secrets.TTSHOP_API_KEY }}" || echo "keywords collection failed"
          python tools/collect_socialcrawl.py --region TH --limit 30 || echo "socialcrawl collection skipped/failed"

      - name: 生成数据与看板
        run: |
          python tools/build_sea_report.py || echo "sea report build skipped"
          python - <<'PY'
          import os, sqlite3
          if os.path.exists("data/tiktok_shop.db"):
              n = sqlite3.connect("data/tiktok_shop.db").execute("select count(*) from products").fetchone()[0]
              print("DB_PRODUCTS=", n)
          else:
              print("NO_DB")
          PY

      - name: 复制为 Pages 首页
        run: |
          cp reports/tiktok_shop_report.html reports/index.html
          if [ -f data/tiktok_shop.db ]; then cp data/tiktok_shop.db reports/tiktok_shop.db; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
