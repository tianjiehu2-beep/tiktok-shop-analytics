name: daily-report

on:
  schedule:
    - cron: "30 0 * * *"     # 每天 00:30 UTC = 北京时间 08:30
  workflow_dispatch:          # 支持在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成数据与看板
        run: |
          if [ -f reports/index.html ] && grep -q "数据源：api" reports/index.html 2>/dev/null; then
            echo "检测到已提交的真实数据，跳过采集，直接部署"
          elif [ -n "${{ secrets.TTSHOP_API_KEY }}" ]; then
            python main.py run --source api --category-id 603084 --pages 5 --sort sales7d --enrich --api-key "${{ secrets.TTSHOP_API_KEY }}" || python main.py run --source demo --products 300
            python main.py run --source api --keyword "yoga mat" --limit 30 --with-influencers --api-key "${{ secrets.TTSHOP_API_KEY }}" || echo "keyword collection skipped"
            python main.py influencers --sort followers --pages 2 --limit 20 --api-key "${{ secrets.TTSHOP_API_KEY }}" || echo "influencers collection skipped"
            python main.py keywords --tab all --limit 15 --api-key "${{ secrets.TTSHOP_API_KEY }}" || echo "keywords collection skipped"
          else
            python main.py run --source demo --products 300
          fi

      - name: 复制为 Pages 首页
        run: cp reports/tiktok_shop_report.html reports/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
